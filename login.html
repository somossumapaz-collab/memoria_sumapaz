<!DOCTYPE html>
<html lang="es">

<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Somos Sumapaz</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">
    <!-- Static Cache-Busting -->
    <script>
        const timestamp = new Date().getTime();
        document.write(`<link rel="stylesheet" href="assets/styles.css?v=${timestamp}">`);
    </script>
    <style>
        .password-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-container input {
            width: 100%;
            padding-right: 2.75rem;
        }

        .toggle-password-btn {
            position: absolute;
            right: 0.75rem;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            transition: color 0.2s;
        }

        .toggle-password-btn:hover {
            color: var(--primary-green, #2E7D32);
        }

        .toggle-password-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .remember-me-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1rem;
            margin-bottom: 1.25rem;
            font-size: 0.95rem;
            color: var(--text-main, #333);
            user-select: none;
        }

        .remember-me-container input[type="checkbox"] {
            width: 17px;
            height: 17px;
            accent-color: var(--primary-green, #2E7D32);
            cursor: pointer;
        }

        .remember-me-container label {
            cursor: pointer;
            font-weight: 500;
            margin: 0;
        }
    </style>
</head>

<body>
    <!-- Main Header -->
    <header id="main-header">
        <nav class="navbar-custom">
            <div class="container" style="display: flex; align-items: center;">
                <a href="index.html">
                    <img src="assets/logo_somossumapaz.png" alt="Somos Sumapaz" class="logo-img">
                </a>
            </div>
        </nav>
    </header>

    <main class="container" style="margin-top: 3rem; margin-bottom: 5rem;">
        <div class="form-card" style="max-width: 450px; margin: 0 auto; padding: 2.5rem; border-radius: 16px;">
            <h2 style="font-family: 'Playfair Display', serif; color: var(--primary-green); text-align: center; margin-bottom: 2rem;">
                Iniciar Sesión
            </h2>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Usuario o Correo Electrónico</label>
                    <input type="text" id="username" name="username" required placeholder="Ingresa tu usuario o email">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="password-container">
                        <input type="password" id="password" name="password" required placeholder="••••••••">
                        <button type="button" id="toggle-password" class="toggle-password-btn" aria-label="Mostrar u ocultar contraseña">
                            <svg id="eye-icon-show" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg id="eye-icon-hide" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="display: none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="remember-me-container">
                    <input type="checkbox" id="remember-me" name="remember-me">
                    <label for="remember-me">Recordar usuario</label>
                </div>

                <div id="error-message"
                    style="color: #D32F2F; margin-bottom: 1rem; text-align: center; display: none; font-size: 0.9rem;">
                </div>

                <div class="form-submit-container">
                    <button type="submit" class="btn btn-submit" style="width: 100%;">Iniciar Sesión</button>
                </div>
            </form>
        </div>
    </main>

    <!-- App Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Password toggle logic
            const passwordInput = document.getElementById('password');
            const togglePasswordBtn = document.getElementById('toggle-password');
            const eyeIconShow = document.getElementById('eye-icon-show');
            const eyeIconHide = document.getElementById('eye-icon-hide');

            if (togglePasswordBtn && passwordInput) {
                togglePasswordBtn.addEventListener('click', function () {
                    const isPassword = passwordInput.getAttribute('type') === 'password';
                    passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                    eyeIconShow.style.display = isPassword ? 'none' : 'block';
                    eyeIconHide.style.display = isPassword ? 'block' : 'none';
                });
            }

            // Remember user logic
            const usernameInput = document.getElementById('username');
            const rememberMeCheckbox = document.getElementById('remember-me');
            const savedUsername = localStorage.getItem('somos_remembered_username');

            if (savedUsername && usernameInput && rememberMeCheckbox) {
                usernameInput.value = savedUsername;
                rememberMeCheckbox.checked = true;
            }
        });

        document.getElementById('login-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const submitBtn = this.querySelector('button[type="submit"]');
            const errorDiv = document.getElementById('error-message');
            const originalText = submitBtn.textContent;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Verificando...';
            errorDiv.style.display = 'none';

            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());

            // Save or clear remembered username
            const rememberMe = document.getElementById('remember-me').checked;
            if (rememberMe && data.username) {
                localStorage.setItem('somos_remembered_username', data.username.trim());
            } else {
                localStorage.removeItem('somos_remembered_username');
            }

            try {
                const response = await fetch('api/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    sessionStorage.setItem('somos_user_auth', JSON.stringify({
                        authenticated: true,
                        user_id: result.user_id || null,
                        username: data.username,
                        rol: result.rol || 'USUARIO',
                        rol_id: result.rol_id || null,
                        is_admin: result.rol === 'ADMIN',
                        is_concursos_only: result.is_concursos_only || false
                    }));
                    window.location.href = result.redirect || 'productores_registrados.html';
                } else {
                    errorDiv.textContent = result.error || 'Credenciales incorrectas.';
                    errorDiv.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = originalText;
                }
            } catch (error) {
                console.error('Login error:', error);
                errorDiv.textContent = 'Error de red. Intenta de nuevo.';
                errorDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        });
    </script>
</body>
</html>
